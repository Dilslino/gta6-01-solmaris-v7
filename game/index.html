<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmaris — Open-World Sunset City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f2e; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; user-select: none; }
  #hud .panel { background: rgba(10, 8, 24, 0.55); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 8px 12px; }
  #stats { position: absolute; top: 12px; left: 12px; font-size: 15px; line-height: 1.5; }
  #cash { font-size: 22px; font-weight: 800; color: #7dff9b; text-shadow: 0 2px 6px #000; }
  #healthbar { width: 170px; height: 10px; background: rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden; margin-top: 4px; }
  #healthfill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5b5b, #ff9d5b); }
  #wanted { position: absolute; top: 12px; right: 12px; text-align: right; font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 6px #000; }
  #wanted .label { font-size: 11px; letter-spacing: 3px; color: #ffd166; display: block; }
  #objective { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 560px; font-size: 15px; text-shadow: 0 2px 6px #000; }
  #objective .title { font-weight: 800; color: #ffd166; font-size: 16px; }
  #minimap { position: absolute; left: 12px; bottom: 12px; border: 2px solid rgba(255,255,255,0.35); border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,0.5); background: #0d2b45; }
  #speedo { position: absolute; right: 14px; bottom: 12px; text-align: right; text-shadow: 0 2px 6px #000; }
  #speedo .num { font-size: 34px; font-weight: 800; }
  #speedo .unit { font-size: 12px; color: #cfd8ff; }
  #hint { position: absolute; right: 14px; bottom: 86px; text-align: right; font-size: 12px; color: #e8ecff; text-shadow: 0 1px 4px #000; line-height: 1.6; }
  #toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); font-size: 19px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px #000; text-align: center; }
  #spot { position: absolute; top: 86px; right: 12px; text-align: right; font-size: 13px; color: #ffe9a8; text-shadow: 0 2px 6px #000; display: none; }
  #spotbar { width: 150px; height: 8px; background: rgba(255,255,255,0.25); border-radius: 4px; overflow: hidden; margin-left: auto; }
  #spotfill { height: 100%; width: 0%; background: #ffe14d; }
  #center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; pointer-events: auto; }
  #center h1 { font-size: 64px; margin: 0; letter-spacing: 6px; color: #fff; text-shadow: 0 4px 24px rgba(255,120,40,0.9), 0 2px 6px #000; }
  #center h2 { font-size: 20px; margin: 6px 0 18px; color: #ffd166; font-weight: 600; text-shadow: 0 2px 6px #000; }
  #center .sub { font-size: 14px; color: #e8ecff; max-width: 520px; line-height: 1.6; text-shadow: 0 1px 4px #000; }
  #center button, .menubtn { pointer-events: auto; cursor: pointer; font: inherit; font-size: 17px; font-weight: 700; color: #1a0f2e; background: #ffd166; border: none; border-radius: 10px; padding: 12px 26px; margin: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  #center button:hover, .menubtn:hover { background: #ffe14d; }
  #center button.ghost { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.5); }
  #bigmsg { font-size: 72px; font-weight: 900; letter-spacing: 8px; margin: 0; }
  #bigmsg.wasted { color: #ff5b5b; text-shadow: 0 0 32px rgba(255,40,40,0.8), 0 2px 6px #000; }
  #bigmsg.busted { color: #5b8cff; text-shadow: 0 0 32px rgba(60,110,255,0.8), 0 2px 6px #000; }
  #muteBtn { position: absolute; top: 118px; right: 12px; pointer-events: auto; cursor: pointer; background: rgba(10,8,24,0.55); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; display: none; }
  #crosshair:before, #crosshair:after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 4px #000; }
  #crosshair:before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair:after { left: 0; top: 8px; width: 18px; height: 2px; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(20,5,30,0.45) 100%); }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmaris: an original open-world sunset city game. Drive, steal cars, run missions, evade the police."></canvas>
<div id="vignette"></div>
<div id="hud">
  <div id="stats" class="panel"><div id="cash">$250</div><div id="healthbar"><div id="healthfill"></div></div><div id="armor">SOLMARIS &middot; <span id="clock">18:42</span></div></div>
  <div id="wanted"><span class="label">WANTED</span><span id="stars"></span></div>
  <div id="objective"><div class="title" id="objTitle">SOLMARIS</div><div id="objText">Press ENTER to start a new game.</div></div>
  <canvas id="minimap" width="190" height="190"></canvas>
  <div id="speedo"><div class="num" id="speedNum">0</div><div class="unit" id="speedUnit">km/h &middot; ON FOOT</div></div>
  <div id="hint">WASD move &middot; SHIFT run &middot; SPACE jump / handbrake<br>E enter / steal car &middot; F punch &middot; CLICK shoot<br>R save &middot; M mute &middot; P pause &middot; drag mouse: camera</div>
  <div id="toast"></div>
  <div id="spot"><div>SEARCHLIGHT &mdash; BREAK LINE OF SIGHT!</div><div id="spotbar"><div id="spotfill"></div></div></div>
  <button id="muteBtn" title="Mute (M)">SOUND: ON</button>
  <div id="crosshair"></div>
  <div id="center"></div>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
